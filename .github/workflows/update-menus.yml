name: Update menus

on:
  schedule:
    # Monday–Friday 05:00 UTC (~07:00 Budapest winter / 06:00–07:00 summer)
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape and parse menus
        env:
          GEMINI_APIKEY: ${{ secrets.GEMINI_APIKEY }}
          HEADLESS: "true"
        run: npm run scrape

      - name: Commit updated menus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/menus.json
          if git diff --staged --quiet; then
            echo "No menu changes"
          else
            git commit -m "chore: refresh weekly menus"
            git push
          fi
